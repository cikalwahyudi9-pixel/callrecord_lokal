name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: call_recorder_local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Save Android config before flutter create
        run: |
          cp android/settings.gradle /tmp/settings.gradle.bak
          cp android/build.gradle /tmp/build.gradle.bak
          cp android/app/build.gradle /tmp/app-build.gradle.bak
          cp android/gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak

      - name: Recreate missing Flutter project files
        run: flutter create --project-name call_recorder_local --org com.example --platforms android .

      - name: Restore Android config
        run: |
          # Remove conflicting .kts files generated by flutter create
          rm -f android/build.gradle.kts
          rm -f android/app/build.gradle.kts
          rm -f android/settings.gradle.kts
          # Restore our config with correct AGP 8.7.3, Kotlin 2.2.20, Gradle 8.11.1
          cp /tmp/settings.gradle.bak android/settings.gradle
          cp /tmp/build.gradle.bak android/build.gradle
          cp /tmp/app-build.gradle.bak android/app/build.gradle
          cp /tmp/gradle-wrapper.properties.bak android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: call-recorder-release-apk
          path: call_recorder_local/build/app/outputs/flutter-apk/app-release.apk
